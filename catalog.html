<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Azy | Editor Portfolio</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@lottiefiles/dotlottie-wc@0.9.10/dist/dotlottie-wc.js" type="module"></script>
    <link rel="icon" type="image/png" href="Pictures/Azy Logo.png">
    
    <style>
        :root {
            --bg-gradient: radial-gradient(circle at 50% 10%, #15151e 0%, #050505 100%);
            --glass: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
            --accent: #3b82f6;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        body { background: var(--bg-gradient); color: #fff; font-family: 'Poppins', sans-serif; overflow-x: hidden; padding-bottom: 120px; }

        /* --- BOTTOM FLUID NAVBAR --- */
        .bottom-nav {
            position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
            background: rgba(20, 20, 25, 0.7); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.1); border-radius: 50px;
            display: flex; align-items: center; padding: 8px 12px; z-index: 10000;
            box-shadow: 0 20px 40px rgba(0,0,0,0.8);
            max-width: 95vw; overflow-x: auto; white-space: nowrap;
        }
        
        .bottom-nav::-webkit-scrollbar { display: none; }
        .bottom-nav { -ms-overflow-style: none; scrollbar-width: none; }

        .nav-divider { width: 1px; height: 24px; background: rgba(255,255,255,0.2); margin: 0 10px; flex-shrink: 0; }

        /* Dynamic Expanding Navbar Container */
        .bottom-dynamic-nav {
            display: flex; align-items: center; gap: 5px;
            max-width: 0; opacity: 0; overflow: hidden; margin-left: 0;
            transition: max-width 0.6s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.4s ease, margin 0.4s ease;
        }
        .bottom-dynamic-nav.show {
            max-width: 800px; opacity: 1; margin-left: 10px;
        }

        .bubble-btn {
            position: relative; overflow: hidden; color: #888; text-decoration: none;
            padding: 12px 25px; border-radius: 40px; font-weight: 600; font-size: 0.95rem;
            transition: color 0.3s ease, background 0.3s ease; cursor: pointer; z-index: 1; border: none; background: transparent; flex-shrink: 0;
            display: flex; align-items: center; gap: 8px;
        }
        .bubble-btn.active { color: #fff; background: rgba(255,255,255,0.15); box-shadow: inset 0 0 10px rgba(255,255,255,0.05); }
        .bubble-btn:hover { color: #fff; }
        
        .bubble-btn::before {
            content: ''; position: absolute; top: var(--y, 50%); left: var(--x, 50%);
            width: 0; height: 0; background: rgba(255,255,255,0.15);
            border-radius: 50%; transform: translate(-50%, -50%);
            transition: width 0.5s ease-out, height 0.5s ease-out; z-index: -1;
        }
        .bubble-btn:hover::before { width: 250px; height: 250px; }

        .bubble-btn svg { width: 18px; height: 18px; fill: rgba(255, 255, 255, 0.6); transition: fill 0.3s ease; }
        .bubble-btn:hover svg, .bubble-btn.active svg { fill: var(--accent); }

        /* Profile Menu Logic */
        .profile-menu-container { position: relative; display: flex; align-items: center; justify-content: center; margin-left: 5px; }
        .profile-logo { width: 38px; height: 38px; border-radius: 50%; cursor: pointer; border: 2px solid transparent; transition: 0.3s; object-fit: cover; }
        .profile-logo:hover { border-color: var(--accent); transform: scale(1.05); }
        
        .profile-popup {
            position: absolute; bottom: 65px; right: 0;
            background: rgba(20, 20, 25, 0.9); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border); border-radius: 16px;
            padding: 10px; display: flex; flex-direction: column; gap: 5px;
            min-width: 180px; box-shadow: 0 15px 30px rgba(0,0,0,0.8);
            
            opacity: 0; transform: translateY(20px) scale(0.95); pointer-events: none;
            transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1); transform-origin: bottom right;
        }
        .profile-popup.active { opacity: 1; transform: translateY(0) scale(1); pointer-events: auto; }

        .popup-item {
            display: flex; align-items: center; gap: 12px; color: #ccc; text-decoration: none;
            padding: 12px 15px; border-radius: 10px; font-size: 0.9rem; transition: 0.2s; font-weight: 500; cursor: pointer;
        }
        .popup-item:hover { background: rgba(255,255,255,0.1); color: #fff; }
        .popup-item svg { width: 20px; height: 20px; fill: currentColor; }

        /* --- LOADING SCREEN --- */
        #intro-layer { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #050505; z-index: 9999; display: flex; flex-direction: column; justify-content: center; align-items: center; transition: opacity 0.6s ease-in-out; }
        .intro-loading-logo { width: 140px; margin-bottom: -30px; z-index: 10; }

        /* --- MAIN INTERFACE --- */
        header { text-align: center; margin: 80px 0 50px 0; }
        h1 { font-size: 3.5rem; font-weight: 800; letter-spacing: -2px; margin-bottom: 10px; }
        p.tagline { color: #888; font-size: 1.1rem; letter-spacing: 2px; text-transform: uppercase; }

        /* Top Header Categories */
        .category-nav { display: flex; justify-content: center; gap: 15px; margin-top: 30px; flex-wrap: wrap; position: relative; z-index: 10; }
        .nav-pill {
            padding: 10px 25px; border-radius: 50px; background: rgba(255,255,255,0.05); color: #fff; 
            text-decoration: none; font-size: 0.9rem; font-weight: 600; border: 1px solid transparent; transition: 0.3s;
            display: flex; align-items: center; gap: 8px;
        }

        .nav-pill svg { width: 18px; height: 18px; fill: rgba(255, 255, 255, 0.6); transition: fill 0.3s ease; }
        .nav-pill:hover svg { fill: #fff; }
        .nav-pill:hover, .nav-pill.active { background: rgba(255,255,255,0.1); border-color: var(--accent); color: var(--accent); }
        .nav-pill.active svg { fill: var(--accent); }

        #main-content { max-width: 1300px; margin: 0 auto; padding: 0 20px; }
        
        .category-section { margin-bottom: 100px; scroll-margin-top: 50px; }
        .category-header { font-size: 1.8rem; margin-bottom: 25px; padding-bottom: 15px; border-bottom: 1px solid var(--glass-border); font-weight: 700; display: flex; align-items: center; gap: 15px; }
        .category-count { font-size: 0.9rem; background: rgba(255,255,255,0.1); padding: 4px 10px; border-radius: 8px; color: #ccc; }

        .category-disclaimer { text-align: center; color: #888; margin-top: -10px; margin-bottom: 25px; font-size: 0.95rem; font-style: italic; }
        .filter-nav { display: flex; justify-content: center; gap: 10px; margin-bottom: 30px; flex-wrap: wrap; position: relative; z-index: 10; }
        .filter-btn { background: rgba(255, 255, 255, 0.05); color: #fff; border: 1px solid var(--glass-border); padding: 8px 20px; border-radius: 50px; cursor: pointer; transition: 0.3s ease; font-size: 0.9rem; font-family: 'Poppins', sans-serif; }
        .filter-btn:hover, .filter-btn.active { background: var(--accent); border-color: var(--accent); }

        /* --- STRICT LAYOUTS --- */
        .video-grid { display: flex; flex-wrap: wrap; gap: 25px; justify-content: flex-start; align-items: flex-start; }
        .video-grid .project-card { width: calc(33.333% - 16.66px); margin-bottom: 25px; }

        .masonry-wrapper { display: flex; gap: 25px; align-items: flex-start; width: 100%; justify-content: flex-start; }
        .masonry-col { display: flex; flex-direction: column; gap: 25px; }
        .masonry-col .project-card { width: 100%; }

        .project-card { background: rgba(0,0,0,0.5); border-radius: 16px; overflow: hidden; border: 1px solid var(--glass-border); transition: 0.4s; position: relative; cursor: pointer; }
        .project-card:hover { transform: translateY(-10px); border-color: var(--accent); box-shadow: 0 15px 40px rgba(0,0,0,0.8); }

        .video-wrapper { width: 100%; position: relative; background: #000; overflow: hidden; }
        .video-wrapper.landscape { aspect-ratio: 16/9; }
        .video-wrapper.vertical { aspect-ratio: 9/16; }
        .video-wrapper.photo-card { aspect-ratio: auto; }

        .video-wrapper iframe { width: 100%; height: 100%; border: none; pointer-events: none; position: absolute; top: 0; left: 0; }
        .video-wrapper img { width: 100%; height: auto; display: block; }
        
        .hover-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 2; background: transparent; }

        .click-hint { position: absolute; bottom: 10px; right: 10px; background: rgba(0,0,0,0.7); color: white; padding: 5px 10px; font-size: 0.7rem; border-radius: 4px; opacity: 0; transition: 0.3s; z-index: 3; pointer-events: none; font-weight: 500; }
        .project-card:hover .click-hint { opacity: 1; }

        .info { padding: 20px; }
        .info h3 { font-size: 1.1rem; margin-bottom: 5px; color: #eee; font-weight: 600; }
        .info p { font-size: 0.85rem; color: #888; font-weight: 300; }

        footer { text-align: center; padding: 40px 0; border-top: 1px solid var(--glass-border); margin-top: 50px;}

        /* --- POPUP MODAL --- */
        #video-modal { display: none; position: fixed; z-index: 10001; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.95); justify-content: center; align-items: center; opacity: 0; transition: 0.3s; }
        #video-modal.active { display: flex; opacity: 1; }
        .modal-content.unified-view { width: 95%; max-width: 1400px; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        
        .gallery-wrapper { position: relative; display: flex; align-items: center; justify-content: center; width: 100%; height: 100%; }
        .slide-content-container { display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100%; max-height: 95vh; transition: transform 0.35s ease, opacity 0.35s ease; }
        
        .media-caption { color: #ccc; font-size: 1.1rem; max-width: 800px; text-align: center; font-style: italic; font-weight: 300; margin-bottom: 15px; }
        .media-box { display: flex; justify-content: center; align-items: center; position: relative; width: 100%; }
        .media-box.landscape { aspect-ratio: 16/9; max-width: 1000px; width: 100%; }
        .media-box.vertical { aspect-ratio: 9/16; max-height: 65vh; width: auto; }
        .media-box iframe { width: 100%; height: 100%; border: none; border-radius: 8px; }
        .media-box.image-box img { max-width: 100%; max-height: 65vh; border-radius: 8px; object-fit: contain; }

        .media-details { text-align: center; margin-top: 20px; }
        .media-title { color: #fff; font-size: 1.6rem; font-weight: 700; text-transform: uppercase; margin-bottom: 5px; }
        .media-subtitle { color: var(--accent); font-size: 1rem; letter-spacing: 2px; text-transform: uppercase; }

        .nav-btn { position: fixed; top: 50%; transform: translateY(-50%); width: 50px; height: 50px; background: rgba(255,255,255,0.05); border-radius: 50%; display: flex; justify-content: center; align-items: center; cursor: pointer; z-index: 10005; transition: 0.2s; border: 1px solid rgba(255,255,255,0.1); }
        .nav-btn:hover { background: rgba(255,255,255,0.15); transform: translateY(-50%) scale(1.1); }
        .nav-btn svg { width: 28px; height: 28px; fill: #fff; opacity: 0.8; }
        .prev-btn { left: 30px; } .next-btn { right: 30px; }
        
        .close-btn { position: absolute; top: 20px; right: 30px; color: #fff; font-size: 40px; cursor: pointer; z-index: 10006; transition: 0.2s; }
        .close-btn:hover { color: var(--accent); transform: scale(1.1); }
        .modal-content.pdf-view { width: 90%; height: 90vh; background: #e0e0e0; border-radius: 8px; overflow-y: auto; text-align: center; display: flex; flex-direction: column; align-items: center; padding-bottom: 40px; }
        .modal-content.pdf-view .close-btn { color: #333; } 
        .resume-img { max-width: 100%; height: auto; display: block; margin: 20px auto; box-shadow: 0 4px 20px rgba(0,0,0,0.3); }
        .download-btn { margin-top: 25px; padding: 12px 30px; background-color: var(--accent); color: white; font-weight: bold; text-decoration: none; border-radius: 50px; display: inline-flex; align-items: center; gap: 10px; transition: 0.2s; box-shadow: 0 4px 10px rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.2); }
        .download-btn:hover { background-color: #2563eb; transform: translateY(-2px); }

        #toast {
            position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%) translateY(100px);
            background: rgba(255, 255, 255, 0.9); color: #000; padding: 12px 25px; border-radius: 50px;
            font-weight: 600; font-size: 0.9rem; transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 10000; pointer-events: none; display: flex; align-items: center; gap: 8px; opacity: 0;
        }
        #toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

        @media (max-width: 1000px) { .video-grid .project-card { width: calc(50% - 12.5px); } }
        @media (max-width: 650px) { 
            .video-grid .project-card { width: 100%; } .masonry-col { display: block; }
            h1 { font-size: 2.5rem; } .media-box.landscape { max-width: 100%; } .media-box.image-box img { max-height: 50vh; }
            .prev-btn { left: 10px; width: 40px; height: 40px; } .next-btn { right: 10px; width: 40px; height: 40px; }
        }
    </style>
</head>
<body>

    <!-- LOADING SCREEN -->
    <div id="intro-layer">
        <img src="Pictures/loadinglogo.png" alt="Loading" class="intro-loading-logo" onerror="this.src='Pictures/Azy Logo.png'">
        <dotlottie-wc src="https://lottie.host/9209af93-c3da-4b0d-9f8f-25861d6141df/otyHASqhzY.lottie" style="width: 300px;height: 300px" autoplay loop></dotlottie-wc>
    </div>

    <!-- BOTTOM FLUID NAVBAR (Identical to Home + Expandable Categories) -->
    <nav class="bottom-nav">
        <a href="index.html" class="bubble-btn">Home</a>
        <a href="catalog.html" class="bubble-btn active">Work</a>
        
        <!-- Expanding Category Links on Scroll -->
        <div id="bottom-dynamic-nav" class="bottom-dynamic-nav"></div>

        <div class="nav-divider"></div>
        <div class="profile-menu-container">
            <img src="Pictures/Azy Logo.png" alt="Profile" class="profile-logo" onclick="toggleProfileMenu(event)">
            <div class="profile-popup" id="profile-popup">
                <!-- Socials Injected via JS -->
            </div>
        </div>
    </nav>

    <main id="main-content">
        <header>
            <h1 id="header-title"></h1>
            <p class="tagline" id="header-tagline"></p>
            <!-- Categories Restored to Top! Icons added inside -->
            <nav class="category-nav" id="dynamic-nav"></nav>
        </header>

        <div id="dynamic-content"></div>
        
        <footer>
            <p style="opacity: 0.6; font-size: 0.9rem;" id="footer-text"></p>
        </footer>
    </main>

    <div id="video-modal" onclick="closeModal()">
        <span class="close-btn" id="modal-close">&times;</span>
        <div class="modal-content" id="modal-container" onclick="event.stopPropagation()"></div>
    </div>

    <div id="toast"><span>✅</span> Email copied to clipboard!</div>

    <script>
        let globalData = {};
        let allPhotoItems = [];
        let currentPhotoFilter = 'all';
        let currentGallery = [];
        let currentGalleryIndex = 0;

        function applyBubbleEffect() {
            document.querySelectorAll('.bubble-btn').forEach(btn => {
                const newBtn = btn.cloneNode(true);
                btn.parentNode.replaceChild(newBtn, btn);
                
                newBtn.addEventListener('mousemove', function(e) {
                    const rect = this.getBoundingClientRect();
                    const x = e.clientX - rect.left;
                    const y = e.clientY - rect.top;
                    this.style.setProperty('--x', x + 'px');
                    this.style.setProperty('--y', y + 'px');
                });
            });
        }

        window.addEventListener('load', () => {
            fetch('data.json')
                .then(response => response.json())
                .then(data => {
                    globalData = data;
                    renderSite(data);
                    populateProfileMenu(data);
                    
                    setTimeout(() => { 
                        document.getElementById('intro-layer').style.opacity = '0';
                        document.getElementById('intro-layer').style.pointerEvents = 'none';
                    }, 1200); 
                });
        });

        // Populate Profile Menu (Same as Home)
        function populateProfileMenu(data) {
            const popup = document.getElementById('profile-popup');
            popup.innerHTML = ''; 

            if (data.footer.links.facebook) {
                popup.innerHTML += `<a href="${data.footer.links.facebook}" target="_blank" class="popup-item">
                    <svg viewBox="0 0 24 24"><path d="M12 2.04C6.5 2.04 2 6.53 2 12.06C2 17.06 5.66 21.21 10.44 21.96V14.96H7.9V12.06H10.44V9.85C10.44 7.34 11.93 5.96 14.15 5.96C15.21 5.96 16.12 6.04 16.38 6.07V8.7H14.85C13.63 8.7 13.39 9.28 13.39 10.13V12.06H16.31L15.84 14.96H13.39V21.96C18.17 21.21 21.83 17.06 21.83 12.06C21.83 6.53 17.33 2.04 12 2.04Z"/></svg> Facebook
                </a>`;
            }
            if (data.footer.links.whatsapp) {
                popup.innerHTML += `<a href="${data.footer.links.whatsapp}" target="_blank" class="popup-item">
                    <svg viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg> WhatsApp
                </a>`;
            }
            if (data.footer.links.email) {
                popup.innerHTML += `<div class="popup-item" onclick="copyEmail('${data.footer.links.email}')">
                    <svg viewBox="0 0 24 24"><path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg> Email Me
                </div>`;
            }
            if (data.footer.links.resumePdf) {
                popup.innerHTML += `<a href="${data.footer.links.resumePdf}" target="_blank" class="popup-item">
                    <svg viewBox="0 0 24 24"><path d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z"/></svg> Resume
                </a>`;
            }
            
            popup.innerHTML += `<a href="https://www.linkedin.com/in/dhasydony-villanueva-916739326" target="_blank" class="popup-item">
                <svg viewBox="0 0 24 24"><path d="M19 0h-14c-2.761 0-5 2.239-5 5v14c0 2.761 2.239 5 5 5h14c2.762 0 5-2.239 5-5v-14c0-2.761-2.238-5-5-5zm-11 19h-3v-11h3v11zm-1.5-12.268c-.966 0-1.75-.79-1.75-1.764s.784-1.764 1.75-1.764 1.75.79 1.75 1.764-.783 1.764-1.75 1.764zm13.5 12.268h-3v-5.604c0-3.368-4-3.113-4 0v5.604h-3v-11h3v1.765c1.396-2.586 7-2.777 7 2.476v6.759z"/></svg> LinkedIn
            </a>`;
        }

        function toggleProfileMenu(e) {
            e.stopPropagation();
            document.getElementById('profile-popup').classList.toggle('active');
        }

        document.addEventListener('click', (e) => {
            const popup = document.getElementById('profile-popup');
            const logo = document.querySelector('.profile-logo');
            if (popup && popup.classList.contains('active') && e.target !== logo && !popup.contains(e.target)) {
                popup.classList.remove('active');
            }
        });

        // ScrollSpy Logic - Toggles active state AND expands bottom navbar
        window.addEventListener('scroll', () => {
            let currentSection = '';
            const sections = document.querySelectorAll('.category-section');
            
            sections.forEach(section => {
                const sectionTop = section.offsetTop - 200; 
                if (window.scrollY >= sectionTop) {
                    currentSection = section.getAttribute('id');
                }
            });

            // Highlight active links
            document.querySelectorAll('.nav-pill, .nav-category-btn').forEach(btn => {
                btn.classList.remove('active');
                if (btn.getAttribute('href') === `#${currentSection}`) {
                    btn.classList.add('active');
                }
            });

            // Reveal bottom category links when scrolled past header
            const header = document.querySelector('header');
            const bottomDynamicNav = document.getElementById('bottom-dynamic-nav');
            if (header && window.scrollY > 150) {
                bottomDynamicNav.classList.add('show');
            } else {
                bottomDynamicNav.classList.remove('show');
            }
        });

        window.addEventListener('resize', () => {
            clearTimeout(window.resizeTimer);
            window.resizeTimer = setTimeout(() => { if(allPhotoItems.length > 0) renderPhotos(); }, 100);
        });

        function renderSite(data) {
            document.title = data.meta.pageTitle;
            document.getElementById('header-title').innerText = data.header.title;
            document.getElementById('header-tagline').innerText = data.header.tagline;
            document.getElementById('footer-text').innerText = data.footer.text;

            const navContainer = document.getElementById('dynamic-nav');
            const bottomNavContainer = document.getElementById('bottom-dynamic-nav');
            const contentContainer = document.getElementById('dynamic-content');

            const categoryIcons = {
                'Vlogs / Long Form': '<svg viewBox="0 0 256 256"><path d="M216,40H40A16,16,0,0,0,24,56V160a16,16,0,0,0,16,16V208a8,8,0,0,0,13.66,5.66L85.66,176H216a16,16,0,0,0,16-16V56A16,16,0,0,0,216,40ZM140,112,112,128V96l28,16Zm76,48H40V56H216v88l-72-36,72,36,72-36V160Z"/></svg>', 
                'Short Form': '<svg viewBox="0 0 256 256"><path d="M176,16H80A24,24,0,0,0,56,40V216a24,24,0,0,0,24,24h96a24,24,0,0,0,24-24V40A24,24,0,0,0,176,16Zm8,200a8,8,0,0,1-8,8H80a8,8,0,0,1-8-8V152H184Zm0-64H72V40a8,8,0,0,1,8-8h96a8,8,0,0,1,8,8v112Z"/></svg>', 
                'Films / Documentary': '<svg viewBox="0 0 256 256"><path d="M208,40H48A16,16,0,0,0,32,56V200a16,16,0,0,0,16,16H208a16,16,0,0,0,16-16V56A16,16,0,0,0,208,40ZM48,56H72v24H48ZM72,136H48v-8H72Zm-8,24V120a8,8,0,0,1,16,0v40a8,8,0,0,1-16,0Z"/></svg>', 
                'Pictures': '<svg viewBox="0 0 256 256"><path d="M208,40H48A16,16,0,0,0,32,56V200a16,16,0,0,0,16,16H208a16,16,0,0,0,16-16V56A16,16,0,0,0,208,40Zm0,160H48V56H208V200Z"/></svg>', 
                'default': '<svg viewBox="0 0 256 256"><path d="M224,96l-88-56a16,16,0,0,0-16,0L32,96a16,16,0,0,0,0,28l88,56a16,16,0,0,0,16,0l88-56a16,16,0,0,0,0-28Zm-104,80L48,128,120,80l80,48-80,48Z"/></svg>'
            };

            data.categories.forEach((cat, idx) => {
                const isActive = idx === 0 ? 'active' : '';
                const iconHtml = categoryIcons[cat.name] || categoryIcons['default'];

                // Populate Top Header Categories
                navContainer.innerHTML += `<a href="#${cat.id}" class="nav-pill ${isActive}">${iconHtml}${cat.name}</a>`;
                
                // Populate Expanding Bottom Nav Categories
                bottomNavContainer.innerHTML += `<a href="#${cat.id}" class="bubble-btn nav-category-btn ${isActive}">${iconHtml}${cat.name}</a>`;

                const section = document.createElement('section');
                section.id = cat.id;
                section.className = 'category-section';

                const mediaItems = cat.videos || cat.items || [];
                let headerHtml = `
                    <div class="category-header">
                        <h2>${cat.name}</h2> <span class="category-count">${String(mediaItems.length).padStart(2, '0')}</span>
                    </div>`;

                if (cat.id === 'pictures') {
                    allPhotoItems = mediaItems;
                    headerHtml += `
                        <p class="category-disclaimer">All pictures are captured and edited by me.</p>
                        <div class="filter-nav" id="photo-filters">
                            <button class="filter-btn active" onclick="filterPhotos('all', this)">All</button>
                            <button class="filter-btn" onclick="filterPhotos('events', this)">Events</button>
                            <button class="filter-btn" onclick="filterPhotos('foods', this)">Foods</button>
                            <button class="filter-btn" onclick="filterPhotos('landscapes', this)">Landscapes</button>
                            <button class="filter-btn" onclick="filterPhotos('portraits', this)">Portraits</button>
                            <button class="filter-btn" onclick="filterPhotos('sports', this)">Sports</button>
                            <button class="filter-btn" onclick="filterPhotos('layouts', this)">Layouts</button>
                        </div>
                    `;
                    section.innerHTML = headerHtml + `<div id="photo-masonry" class="masonry-wrapper"></div>`;
                    contentContainer.appendChild(section);
                    renderPhotos(); 
                } 
                else {
                    let gridHtml = `<div class="video-grid">`;
                    mediaItems.forEach((item, index) => {
                        gridHtml += `
                            <div class="project-card" data-index="${index}" data-type="video" data-url="${item.youtubeId}" data-format="${item.format}" data-title="${item.title}" data-subtitle="${item.subtitle}" onmouseenter="hoverPlay(this)" onmouseleave="hoverPause(this)">
                                <div class="video-wrapper ${item.format}">
                                    <div class="hover-overlay" onclick="openMedia(this.closest('.project-card'))"></div>
                                    <iframe src="https://www.youtube.com/embed/${item.youtubeId}?enablejsapi=1&mute=1&controls=0&showinfo=0&rel=0" allow="autoplay; encrypted-media" loading="lazy" title="${item.title}"></iframe>
                                </div>
                                <div class="click-hint">Click to Expand</div>
                                <div class="info">
                                    <h3>${item.title}</h3>
                                    <p>${item.subtitle}</p>
                                </div>
                            </div>
                        `;
                    });
                    gridHtml += `</div>`;
                    section.innerHTML = headerHtml + gridHtml;
                    contentContainer.appendChild(section);
                }
            });
            applyBubbleEffect(); 
        }

        function renderPhotos() {
            const wrapper = document.getElementById('photo-masonry');
            if(!wrapper) return;
            wrapper.innerHTML = ''; 

            let filtered = allPhotoItems.filter(item => currentPhotoFilter === 'all' || item.tag === currentPhotoFilter);
            let numCols = window.innerWidth > 1000 ? 3 : (window.innerWidth > 650 ? 2 : 1);
            let cols = [];
            
            for(let i = 0; i < numCols; i++) {
                let col = document.createElement('div');
                col.className = 'masonry-col';
                if (numCols === 3) col.style.width = 'calc(33.333% - 16.66px)';
                else if (numCols === 2) col.style.width = 'calc(50% - 12.5px)';
                else col.style.width = '100%';
                cols.push(col);
                wrapper.appendChild(col);
            }

            filtered.forEach((item, index) => {
                const encodedCaption = item.caption ? encodeURIComponent(item.caption) : '';
                const tagAttr = item.tag ? `data-tag="${item.tag}"` : `data-tag="other"`;
                
                let cardHtml = `
                    <div class="project-card photo-post" ${tagAttr} data-index="${index}" data-type="image" data-url="${item.imageUrl}" data-format="photo-card" data-title="${item.title}" data-subtitle="${item.subtitle}" data-caption="${encodedCaption}">
                        <div class="video-wrapper photo-card">
                            <div class="hover-overlay" onclick="openMedia(this.closest('.project-card'))"></div>
                            <img src="${item.imageUrl}" alt="${item.title}" loading="lazy" decoding="async">
                        </div>
                        <div class="click-hint">Click to View</div>
                        <div class="info">
                            <h3>${item.title}</h3>
                            <p>${item.subtitle}</p>
                        </div>
                    </div>
                `;
                cols[index % numCols].innerHTML += cardHtml;
            });
        }

        function filterPhotos(category, btnElement) {
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            btnElement.classList.add('active');
            currentPhotoFilter = category;
            renderPhotos(); 
        }

        function hoverPlay(card) {
            const iframe = card.querySelector('iframe');
            if(iframe) iframe.contentWindow.postMessage('{"event":"command","func":"playVideo","args":""}', '*');
        }

        function hoverPause(card) {
            const iframe = card.querySelector('iframe');
            if(iframe) iframe.contentWindow.postMessage('{"event":"command","func":"pauseVideo","args":""}', '*');
        }

        function openResume(imgUrl, pdfUrl) {
            const modal = document.getElementById('video-modal');
            const container = document.getElementById('modal-container');
            const closeBtn = document.getElementById('modal-close');

            container.className = 'modal-content pdf-view';
            closeBtn.style.color = "#333"; 

            container.innerHTML = `
                <a href="${pdfUrl}" download class="download-btn">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="white"><path d="M5 20h14v-2H5v2zM19 9h-4V3H9v6H5l7 7 7-7z"/></svg>
                    Download PDF
                </a>
                <img src="${imgUrl}" class="resume-img" alt="Resume" loading="lazy">
            `;
            modal.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        // --- UNIFIED SLIDER ---
        function openMedia(cardElement) {
            currentGallery = [];
            const section = cardElement.closest('section');
            let cards = Array.from(section.querySelectorAll('.project-card'));
            
            cards.sort((a, b) => parseInt(a.getAttribute('data-index') || 0) - parseInt(b.getAttribute('data-index') || 0));
            
            cards.forEach(card => {
                if (window.getComputedStyle(card).display !== 'none') {
                    currentGallery.push({
                        type: card.getAttribute('data-type'),
                        url: card.getAttribute('data-url'),
                        format: card.getAttribute('data-format'),
                        title: card.getAttribute('data-title'),
                        subtitle: card.getAttribute('data-subtitle'),
                        caption: card.getAttribute('data-caption')
                    });
                }
            });

            currentGalleryIndex = currentGallery.findIndex(item => item.url === cardElement.getAttribute('data-url'));
            if (currentGalleryIndex === -1) currentGalleryIndex = 0;

            const modal = document.getElementById('video-modal');
            const container = document.getElementById('modal-container');

            container.className = 'modal-content unified-view';
            container.innerHTML = `
                <div class="gallery-wrapper">
                    <div class="nav-btn prev-btn" id="gallery-prev" onclick="navigateGallery(-1, event)"><svg viewBox="0 0 24 24"><path d="M15.41 16.59L10.83 12l4.58-4.59L14 6l-6 6 6 6 1.41-1.41z"/></svg></div>
                    <div class="slide-content-container" id="slide-container"></div>
                    <div class="nav-btn next-btn" id="gallery-next" onclick="navigateGallery(1, event)"><svg viewBox="0 0 24 24"><path d="M8.59 16.59L13.17 12 8.59 7.41 10 6l6 6-6 6-1.41-1.41z"/></svg></div>
                </div>
            `;
            
            updateGalleryView('none');
            modal.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function navigateGallery(direction, event) {
            event.stopPropagation();
            const newIndex = currentGalleryIndex + direction;
            if (newIndex >= 0 && newIndex < currentGallery.length) {
                currentGalleryIndex = newIndex;
                updateGalleryView(direction === 1 ? 'right' : 'left');
            }
        }

        function updateGalleryView(direction) {
            const item = currentGallery[currentGalleryIndex];
            const slideContainer = document.getElementById('slide-container');
            
            document.getElementById('gallery-prev').style.display = currentGalleryIndex === 0 ? 'none' : 'flex';
            document.getElementById('gallery-next').style.display = currentGalleryIndex === currentGallery.length - 1 ? 'none' : 'flex';

            if (direction !== 'none' && slideContainer.innerHTML.trim() !== '') {
                slideContainer.style.transform = direction === 'right' ? 'translateX(-30px)' : 'translateX(30px)';
                slideContainer.style.opacity = '0';
                setTimeout(() => { renderSlide(item, direction); }, 200); 
            } else {
                renderSlide(item, 'none');
            }
        }

        function renderSlide(item, direction) {
            const slideContainer = document.getElementById('slide-container');
            
            let captionHtml = item.caption ? `<div class="media-caption">${decodeURIComponent(item.caption)}</div>` : '';
            let mediaHtml = item.type === 'video' 
                ? `<div class="media-box ${item.format}"><iframe src="https://www.youtube.com/embed/${item.url}?autoplay=1&controls=1&rel=0" allow="autoplay; fullscreen"></iframe></div>`
                : `<div class="media-box image-box"><img src="${item.url}" loading="lazy"></div>`;

            slideContainer.innerHTML = captionHtml + mediaHtml + `<div class="media-details"><h3 class="media-title">${item.title}</h3><p class="media-subtitle">${item.subtitle}</p></div>`;
            
            slideContainer.style.transition = 'none';
            slideContainer.style.transform = direction === 'right' ? 'translateX(30px)' : (direction === 'left' ? 'translateX(-30px)' : 'translateX(0)');
            slideContainer.style.opacity = '0';
            void slideContainer.offsetWidth; // trigger reflow
            
            slideContainer.style.transition = 'transform 0.35s ease, opacity 0.35s ease';
            slideContainer.style.transform = 'translateX(0)';
            slideContainer.style.opacity = '1';
        }

        document.addEventListener('keydown', (e) => {
            if (document.getElementById('video-modal').classList.contains('active')) {
                if (currentGallery.length > 0) {
                    if (e.key === 'ArrowLeft' && currentGalleryIndex > 0) navigateGallery(-1, e);
                    else if (e.key === 'ArrowRight' && currentGalleryIndex < currentGallery.length - 1) navigateGallery(1, e);
                }
                if (e.key === 'Escape') closeModal();
            }
        });

        function closeModal() {
            document.getElementById('video-modal').classList.remove('active');
            document.getElementById('modal-container').innerHTML = '';
            document.body.style.overflow = 'auto';
            currentGallery = [];
        }

        function copyEmail(email) {
            navigator.clipboard.writeText(email);
            const toast = document.getElementById('toast');
            toast.classList.add('show');
            setTimeout(() => { toast.classList.remove('show'); }, 3000);
        }
    </script>
</body>
</html>
