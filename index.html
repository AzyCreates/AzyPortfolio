<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Azy | Editor Portfolio</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    
    <script src="https://unpkg.com/@lottiefiles/dotlottie-wc@0.9.10/dist/dotlottie-wc.js" type="module"></script>
    
    <link rel="icon" type="image/png" href="Pictures/Azy Logo.png" id="favicon-link">
    
    <style>
        /* --- 1. SETTINGS & RESET --- */
        :root {
            --bg-gradient: radial-gradient(circle at 50% 10%, #2a2a35 0%, #000000 100%);
            --glass: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-main: #ffffff;
            --text-muted: #888888;
            --accent: #3b82f6;
            
            --fb-color: #1877F2;
            --wa-color: #25D366;
            --mail-color: #EA4335;
            --resume-color: #8e44ad;
        }

        html { scroll-behavior: smooth; }
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: var(--bg-gradient);
            color: var(--text-main);
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
            overflow-y: hidden; 
        }

        /* --- 2. TRUE LOADING SCREEN --- */
        #intro-layer {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: 9999;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            transition: opacity 0.5s ease-in-out;
        }
        .intro-loading-logo {
            width: 140px; height: auto; object-fit: contain; margin-bottom: -30px; z-index: 10;
        }

        /* --- 3. STICKY NAV --- */
        #sticky-nav {
            position: fixed; top: -100px; left: 0; width: 100%;
            background: rgba(25, 25, 32, 0.85); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            z-index: 9000; display: flex; justify-content: center; gap: 15px; padding: 12px 20px;
            transition: top 0.4s ease-in-out; border-bottom: 1px solid var(--glass-border);
            box-shadow: 0 5px 25px rgba(0,0,0,0.5); flex-wrap: wrap;
        }
        #sticky-nav.show { top: 0; }
        #sticky-nav .nav-pill { padding: 8px 20px; font-size: 0.85rem; }

        /* --- 4. MAIN INTERFACE --- */
        #main-content {
            opacity: 0; transform: scale(0.95);
            transition: opacity 0.8s ease, transform 0.8s cubic-bezier(0.16, 1, 0.3, 1);
            padding: 40px 20px; max-width: 1200px; margin: 0 auto; visibility: hidden;
        }

        .glass-panel {
            background: var(--glass); backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px);
            border: 1px solid var(--glass-border); border-radius: 30px; padding: 40px 60px;
            box-shadow: 0 40px 80px rgba(0,0,0,0.6); position: relative;
        }

        header { text-align: center; margin-bottom: 50px; }
        h1 { font-size: 3rem; font-weight: 800; letter-spacing: -2px; margin-bottom: 10px; }
        p.tagline { color: var(--text-muted); font-size: 1.1rem; margin-bottom: 25px; }

        .social-box { display: flex; gap: 20px; justify-content: center; margin-bottom: 30px; }
        .social-btn {
            width: 45px; height: 45px; border-radius: 50%;
            background: rgba(255,255,255,0.1); display: flex; align-items: center; justify-content: center;
            transition: 0.3s ease; cursor: pointer; text-decoration: none;
        }
        .social-btn svg { width: 20px; height: 20px; fill: #fff; }
        .social-btn.fb:hover { background: var(--fb-color); transform: translateY(-3px); }
        .social-btn.wa:hover { background: var(--wa-color); transform: translateY(-3px); }
        .social-btn.mail:hover { background: var(--mail-color); transform: translateY(-3px); }
        .social-btn.resume:hover { background: var(--resume-color); transform: translateY(-3px); }

        .category-nav { display: flex; justify-content: center; gap: 15px; margin-top: 10px; flex-wrap: wrap; }
        .nav-pill {
            padding: 10px 25px; border-radius: 50px; background: rgba(255,255,255,0.05); color: #fff; 
            text-decoration: none; font-size: 0.9rem; font-weight: 600; border: 1px solid transparent; transition: 0.3s;
        }
        .nav-pill:hover { background: rgba(255,255,255,0.15); border-color: rgba(255,255,255,0.3); }

        .category-section { margin-bottom: 80px; scroll-margin-top: 80px; }
        .category-header {
            font-size: 1.5rem; margin-bottom: 25px; padding-bottom: 10px;
            border-bottom: 1px solid var(--glass-border); display: flex; align-items: center; gap: 10px; font-weight: 600;
        }
        .category-count { font-size: 0.8rem; background: #333; padding: 2px 8px; border-radius: 4px; color: #aaa; }
        
        .category-disclaimer {
            text-align: center; color: var(--text-muted); margin-top: -10px; margin-bottom: 25px;
            font-size: 0.95rem; font-style: italic;
        }

        .filter-nav { display: flex; justify-content: center; gap: 10px; margin-bottom: 30px; flex-wrap: wrap; }
        .filter-btn {
            background: rgba(255, 255, 255, 0.05); color: #fff; border: 1px solid var(--glass-border);
            padding: 8px 20px; border-radius: 50px; cursor: pointer; transition: 0.3s ease; font-size: 0.9rem;
            font-family: 'Poppins', sans-serif;
        }
        .filter-btn:hover, .filter-btn.active { background: var(--accent); border-color: var(--accent); }

        /* GRID LAYOUTS */
        .video-grid { 
            display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px; align-items: start; 
        }

        .masonry-container { display: flex; gap: 25px; align-items: flex-start; width: 100%; }
        .masonry-column { flex: 1; display: flex; flex-direction: column; gap: 25px; }

        .project-card {
            background: rgba(0,0,0,0.4); border-radius: 16px; overflow: hidden;
            border: 1px solid rgba(255,255,255,0.05); transition: 0.3s ease; position: relative; width: 100%;
        }
        .project-card:hover { transform: translateY(-8px); border-color: var(--accent); box-shadow: 0 10px 30px rgba(0,0,0,0.5); }

        .video-wrapper { width: 100%; position: relative; background: #000; overflow: hidden; }
        .video-wrapper.landscape { aspect-ratio: 16/9; }
        .video-wrapper.vertical { aspect-ratio: 9/16; }
        .video-wrapper.photo-card { aspect-ratio: auto; }

        .video-wrapper iframe {
            width: 100%; height: 100%; border: none; pointer-events: none; transition: opacity 0.3s;
            position: absolute; top: 0; left: 0;
        }
        .video-wrapper img { width: 100%; height: auto; display: block; object-fit: cover; }
        
        .hover-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 2; cursor: pointer; background: transparent; }
        
        .click-hint {
            position: absolute; bottom: 10px; right: 10px; background: rgba(0,0,0,0.7); color: white;
            padding: 5px 10px; font-size: 0.7rem; border-radius: 4px; opacity: 0; transition: 0.3s; z-index: 3; pointer-events: none; font-weight: 500;
        }
        .project-card:hover .click-hint { opacity: 1; }

        .info { padding: 20px; }
        .info h3 { font-size: 1.1rem; margin-bottom: 5px; color: #eee; font-weight: 600; }
        .info p { font-size: 0.85rem; color: var(--text-muted); font-weight: 300; }

        footer { margin-top: 50px; text-align: center; padding-top: 40px; border-top: 1px solid var(--glass-border); }

        /* --- 5. UNIFIED POPUP MODAL (VIDEOS + IMAGES) --- */
        #video-modal {
            display: none; position: fixed; z-index: 10001; left: 0; top: 0; width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.95); justify-content: center; align-items: center; opacity: 0; transition: opacity 0.3s ease;
        }
        #video-modal.active { display: flex; opacity: 1; }

        /* Unified Media Viewer */
        .modal-content.unified-view {
            width: 95%; max-width: 1400px; background: transparent; box-shadow: none;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
        }

        .gallery-wrapper { position: relative; display: flex; align-items: center; justify-content: center; width: 100%; height: 100%; }

        .slide-content-container {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            width: 100%; max-height: 95vh;
            transition: transform 0.35s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.35s ease; 
        }

        /* 1. TOP: Italic Caption */
        .media-caption {
            color: #d1d5db; font-size: 1.1rem; max-width: 800px; text-align: center;
            font-style: italic; font-weight: 300; margin-bottom: 15px; padding: 0 20px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }

        /* 2. MIDDLE: Media Container */
        .media-box {
            display: flex; justify-content: center; align-items: center; position: relative; width: 100%;
        }
        .media-box.landscape { aspect-ratio: 16/9; max-width: 1000px; width: 100%; }
        .media-box.vertical { aspect-ratio: 9/16; max-height: 65vh; width: auto; }
        
        .media-box iframe {
            width: 100%; height: 100%; border: none; border-radius: 8px; box-shadow: 0 10px 40px rgba(0,0,0,0.8);
        }
        .media-box.image-box img { 
            max-width: 100%; max-height: 65vh; border-radius: 8px; box-shadow: 0 10px 40px rgba(0,0,0,0.8); object-fit: contain;
        }

        /* 3. BOTTOM: Title and Subtitle */
        .media-details {
            text-align: center; margin-top: 20px; padding: 0 20px;
        }
        .media-title {
            color: #fff; font-size: 1.6rem; font-weight: 700; margin-bottom: 5px; text-transform: uppercase; letter-spacing: 1px;
        }
        .media-subtitle {
            color: var(--accent); font-size: 1rem; font-weight: 400; letter-spacing: 2px; text-transform: uppercase;
        }

        /* Minimal Navigation Arrows */
        .nav-btn {
            position: fixed; top: 50%; transform: translateY(-50%);
            width: 50px; height: 50px; background: rgba(255, 255, 255, 0.05); 
            border: 1px solid rgba(255, 255, 255, 0.1); backdrop-filter: blur(8px);
            border-radius: 50%; display: flex; justify-content: center; align-items: center;
            cursor: pointer; z-index: 10005; transition: all 0.2s ease;
        }
        .nav-btn:hover { background: rgba(255, 255, 255, 0.15); transform: translateY(-50%) scale(1.1); }
        .nav-btn svg { width: 28px; height: 28px; fill: #fff; opacity: 0.8; transition: 0.2s; }
        .nav-btn:hover svg { opacity: 1; }
        .prev-btn { left: 30px; }
        .next-btn { right: 30px; }

        /* PDF Viewer */
        .modal-content.pdf-view { 
            width: 90%; height: 90vh; background: #e0e0e0; border-radius: 8px; overflow-y: auto; 
            text-align: center; display: flex; flex-direction: column; align-items: center; padding-bottom: 40px;
        }
        .resume-img { max-width: 100%; height: auto; display: block; margin: 20px auto; box-shadow: 0 4px 20px rgba(0,0,0,0.3); }
        .download-btn {
            margin-top: 25px; padding: 12px 30px; background-color: var(--accent); color: white;
            font-weight: bold; text-decoration: none; border-radius: 50px; display: inline-flex; align-items: center; gap: 10px; transition: 0.2s;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.2);
        }
        .download-btn:hover { background-color: #2563eb; transform: translateY(-2px); }
        
        .close-btn {
            position: absolute; top: 20px; right: 30px; color: #fff;
            font-size: 40px; font-weight: bold; cursor: pointer; z-index: 10006; transition: 0.2s; line-height: 1;
        }
        .close-btn:hover { color: var(--accent); transform: scale(1.1); }
        .modal-content.pdf-view .close-btn { color: #333; } 

        /* --- 6. SCROLL TO TOP BUTTON --- */
        #scroll-top-btn {
            position: fixed; bottom: 30px; right: 30px; width: 50px; height: 50px; background: var(--accent); border-radius: 50%; 
            display: flex; justify-content: center; align-items: center; cursor: pointer; z-index: 9900; opacity: 0; visibility: hidden;
            transform: translateY(20px); transition: all 0.3s ease; box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        #scroll-top-btn.show { opacity: 1; visibility: visible; transform: translateY(0); }
        #scroll-top-btn:hover { background: #2563eb; transform: translateY(-5px); }
        #scroll-top-btn svg { width: 24px; height: 24px; fill: #fff; }

        #toast {
            position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(100px);
            background: rgba(255, 255, 255, 0.9); color: #000; padding: 12px 25px; border-radius: 50px;
            font-weight: 600; font-size: 0.9rem; transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 10000; pointer-events: none; display: flex; align-items: center; gap: 8px; opacity: 0;
        }
        #toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

        @media (max-width: 900px) { .masonry-column:nth-child(3) { display: none; } }
        @media (max-width: 650px) { 
            .video-grid { grid-template-columns: 1fr; }
            .masonry-container { flex-direction: column; gap: 0; }
            .masonry-column { gap: 0; display: block; } 
            .glass-panel { padding: 25px; border-radius: 0; border: none; }
            h1 { font-size: 2.2rem; }
            .modal-content.pdf-view { width: 95%; height: 85vh; }
            #scroll-top-btn { bottom: 20px; right: 20px; width: 45px; height: 45px; }
            
            .media-box.landscape { max-width: 100%; }
            .media-box.image-box img { max-height: 50vh; }
            .media-title { font-size: 1.2rem; }
            .media-caption { font-size: 0.9rem; margin-bottom: 10px; }
            .prev-btn { left: 10px; width: 35px; height: 35px; }
            .next-btn { right: 10px; width: 35px; height: 35px; }
            .nav-btn svg { width: 18px; height: 18px; }
        }
    </style>
</head>
<body>

    <nav id="sticky-nav"></nav>

    <div id="intro-layer">
        <img src="Pictures/loadinglogo.png" alt="Loading" class="intro-loading-logo" onerror="this.src='Pictures/Azy Logo.png'">
        <dotlottie-wc src="https://lottie.host/9209af93-c3da-4b0d-9f8f-25861d6141df/otyHASqhzY.lottie" style="width: 300px;height: 300px" autoplay loop></dotlottie-wc>
    </div>

    <main id="main-content">
        <div class="glass-panel">
            <header>
                <h1 id="header-title"></h1>
                <p class="tagline" id="header-tagline"></p>
                <div class="social-box" id="social-container"></div>
                <nav class="category-nav" id="dynamic-nav"></nav>
            </header>

            <div id="dynamic-content"></div>

            <footer>
                <p style="margin-bottom: 20px; opacity: 0.6; font-size: 0.9rem;" id="footer-text"></p>
                <br><br>
            </footer>
        </div>
    </main>

    <div id="video-modal" onclick="closeModal()">
        <span class="close-btn" id="modal-close">&times;</span>
        <div class="modal-content" id="modal-container" onclick="event.stopPropagation()"></div>
    </div>

    <div id="scroll-top-btn" onclick="scrollToTop()" title="Back to Top">
        <svg viewBox="0 0 24 24"><path d="M12 4l-8 8h6v8h4v-8h6z"/></svg>
    </div>

    <div id="toast"><span>✅</span> Email copied to clipboard!</div>

    <script>
        let globalData = {};
        
        // Unified Gallery State Trackers
        let currentGallery = [];
        let currentGalleryIndex = 0;

        // QUICK LOAD LOGIC
        window.addEventListener('load', () => {
            fetch('data.json')
                .then(response => response.json())
                .then(data => {
                    globalData = data;
                    renderSite(data);
                    setTimeout(() => { hideLoadingScreen(); }, 1500);
                })
                .catch(err => {
                    console.error("Data load error:", err);
                    hideLoadingScreen();
                });
        });

        function hideLoadingScreen() {
            const intro = document.getElementById('intro-layer');
            intro.style.opacity = '0';
            intro.style.pointerEvents = 'none';
            const main = document.getElementById('main-content');
            main.style.visibility = 'visible';
            main.style.opacity = '1';
            main.style.transform = 'scale(1)';
            document.body.style.overflowY = 'auto';
        }

        window.addEventListener('scroll', () => {
            const stickyNav = document.getElementById('sticky-nav');
            const scrollTopBtn = document.getElementById('scroll-top-btn');
            const header = document.querySelector('header');
            
            if (window.scrollY > header.offsetHeight + 50) {
                stickyNav.classList.add('show');
                scrollTopBtn.classList.add('show');
            } else {
                stickyNav.classList.remove('show');
                scrollTopBtn.classList.remove('show');
            }
        });

        window.addEventListener('resize', () => { updateMasonryColumns(); });

        function scrollToTop() { window.scrollTo({ top: 0, behavior: 'smooth' }); }

        function renderSite(data) {
            document.title = data.meta.pageTitle;
            document.getElementById('favicon-link').href = data.meta.favicon;
            document.getElementById('header-title').innerText = data.header.title;
            document.getElementById('header-tagline').innerText = data.header.tagline;
            document.getElementById('footer-text').innerText = data.footer.text;

            const socialContainer = document.getElementById('social-container');
            
            if (data.footer.links.facebook) {
                socialContainer.innerHTML += `
                    <a href="${data.footer.links.facebook}" target="_blank" class="social-btn fb" title="Facebook">
                        <svg viewBox="0 0 24 24"><path d="M12 2.04C6.5 2.04 2 6.53 2 12.06C2 17.06 5.66 21.21 10.44 21.96V14.96H7.9V12.06H10.44V9.85C10.44 7.34 11.93 5.96 14.15 5.96C15.21 5.96 16.12 6.04 16.38 6.07V8.7H14.85C13.63 8.7 13.39 9.28 13.39 10.13V12.06H16.31L15.84 14.96H13.39V21.96C18.17 21.21 21.83 17.06 21.83 12.06C21.83 6.53 17.33 2.04 12 2.04Z"/></svg>
                    </a>`;
            }
            if (data.footer.links.whatsapp) {
                socialContainer.innerHTML += `
                    <a href="${data.footer.links.whatsapp}" target="_blank" class="social-btn wa" title="Chat on WhatsApp">
                         <svg viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
                    </a>`;
            }
            if (data.footer.links.email) {
                socialContainer.innerHTML += `
                    <div class="social-btn mail" title="Copy Email" onclick="copyEmail('${data.footer.links.email}')">
                        <svg viewBox="0 0 24 24"><path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>
                    </div>`;
            }
            if (data.footer.links.resumeImg && data.footer.links.resumePdf) {
                socialContainer.innerHTML += `
                    <div class="social-btn resume" title="View Resume" onclick="openResume('${data.footer.links.resumeImg}', '${data.footer.links.resumePdf}')">
                        <svg viewBox="0 0 24 24"><path d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z"/></svg>
                    </div>`;
            }

            const navContainer = document.getElementById('dynamic-nav');
            const stickyNav = document.getElementById('sticky-nav');
            const contentContainer = document.getElementById('dynamic-content');

            data.categories.forEach(cat => {
                const navLinkHtml = `<a href="#${cat.id}" class="nav-pill">${cat.name}</a>`;
                navContainer.innerHTML += navLinkHtml;
                stickyNav.innerHTML += navLinkHtml;

                const section = document.createElement('section');
                section.id = cat.id;
                section.className = 'category-section';

                const mediaItems = cat.videos || cat.items || [];
                let headerHtml = `
                    <div class="category-header">
                        <h2>${cat.name}</h2> <span class="category-count">${String(mediaItems.length).padStart(2, '0')}</span>
                    </div>`;

                if (cat.id === 'pictures') {
                    headerHtml += `
                        <p class="category-disclaimer">All pictures are captured and edited by me.</p>
                        <div class="filter-nav" id="photo-filters">
                            <button class="filter-btn active" onclick="filterPhotos('all', this)">All</button>
                            <button class="filter-btn" onclick="filterPhotos('events', this)">Events</button>
                            <button class="filter-btn" onclick="filterPhotos('foods', this)">Foods</button>
                            <button class="filter-btn" onclick="filterPhotos('landscapes', this)">Landscapes</button>
                            <button class="filter-btn" onclick="filterPhotos('portraits', this)">Portraits</button>
                        </div>
                    `;
                }

                let sectionHtml = headerHtml;

                if (cat.id === 'pictures') {
                    let col1 = '', col2 = '', col3 = '';
                    mediaItems.forEach((item, index) => {
                        const encodedCaption = item.caption ? encodeURIComponent(item.caption) : '';
                        const tagAttr = item.tag ? `data-tag="${item.tag}"` : `data-tag="other"`;
                        
                        let cardHtml = `
                            <div class="project-card" ${tagAttr} data-type="image" data-url="${item.imageUrl}" data-format="photo-card" data-title="${item.title}" data-subtitle="${item.subtitle}" data-caption="${encodedCaption}">
                                <div class="video-wrapper photo-card">
                                    <div class="hover-overlay" onclick="openMedia(this.closest('.project-card'))"></div>
                                    <img src="${item.imageUrl}" alt="${item.title}" loading="lazy" decoding="async">
                                </div>
                                <div class="click-hint">Click to View</div>
                                <div class="info">
                                    <h3>${item.title}</h3>
                                    <p>${item.subtitle}</p>
                                </div>
                            </div>
                        `;
                        if (index % 3 === 0) col1 += cardHtml;
                        else if (index % 3 === 1) col2 += cardHtml;
                        else col3 += cardHtml;
                    });
                    sectionHtml += `
                        <div class="masonry-container" id="photo-masonry">
                            <div class="masonry-column">${col1}</div>
                            <div class="masonry-column">${col2}</div>
                            <div class="masonry-column">${col3}</div>
                        </div>
                    `;
                } else {
                    let gridHtml = `<div class="video-grid">`;
                    mediaItems.forEach(item => {
                        gridHtml += `
                            <div class="project-card" data-type="video" data-url="${item.youtubeId}" data-format="${item.format}" data-title="${item.title}" data-subtitle="${item.subtitle}" onmouseenter="hoverPlay(this)" onmouseleave="hoverPause(this)">
                                <div class="video-wrapper ${item.format}">
                                    <div class="hover-overlay" onclick="openMedia(this.closest('.project-card'))"></div>
                                    <iframe src="https://www.youtube.com/embed/${item.youtubeId}?enablejsapi=1&mute=1&controls=0&showinfo=0&rel=0" allow="autoplay; encrypted-media" loading="lazy" title="${item.title}"></iframe>
                                </div>
                                <div class="click-hint">Click to Expand</div>
                                <div class="info">
                                    <h3>${item.title}</h3>
                                    <p>${item.subtitle}</p>
                                </div>
                            </div>
                        `;
                    });
                    gridHtml += `</div>`;
                    sectionHtml += gridHtml;
                }

                section.innerHTML = sectionHtml;
                contentContainer.appendChild(section);
            });
        }

        function filterPhotos(category, btnElement) {
            const buttons = document.querySelectorAll('#photo-filters .filter-btn');
            buttons.forEach(btn => btn.classList.remove('active'));
            btnElement.classList.add('active');

            const photos = document.querySelectorAll('#pictures .project-card');
            photos.forEach(photo => {
                if (category === 'all' || photo.getAttribute('data-tag') === category) {
                    photo.style.display = 'block'; 
                } else {
                    photo.style.display = 'none';
                }
            });
            updateMasonryColumns();
        }

        function updateMasonryColumns() {
            const masonryGrid = document.querySelector('.masonry-container');
            if (masonryGrid) {
                let visibleCount = 0;
                document.querySelectorAll('#pictures .project-card').forEach(photo => {
                    if (photo.style.display !== 'none') visibleCount++;
                });

                const cols = document.querySelectorAll('.masonry-column');
                if (window.innerWidth <= 650) {
                    cols[0].style.display = 'flex'; cols[1].style.display = 'none'; cols[2].style.display = 'none';
                } else if (window.innerWidth <= 900 || visibleCount === 2) {
                    cols[0].style.display = 'flex'; cols[1].style.display = 'flex'; cols[2].style.display = 'none';
                } else if (visibleCount === 1) {
                    cols[0].style.display = 'flex'; cols[1].style.display = 'none'; cols[2].style.display = 'none';
                } else {
                    cols[0].style.display = 'flex'; cols[1].style.display = 'flex'; cols[2].style.display = 'flex';
                }
            }
        }

        function hoverPlay(card) {
            const wrapper = card.querySelector('.video-wrapper');
            const iframe = wrapper.querySelector('iframe');
            if(iframe) iframe.contentWindow.postMessage('{"event":"command","func":"playVideo","args":""}', '*');
        }

        function hoverPause(card) {
            const wrapper = card.querySelector('.video-wrapper');
            const iframe = wrapper.querySelector('iframe');
            if(iframe) iframe.contentWindow.postMessage('{"event":"command","func":"pauseVideo","args":""}', '*');
        }

        function openResume(imgUrl, pdfUrl) {
            const modal = document.getElementById('video-modal');
            const container = document.getElementById('modal-container');
            const closeBtn = document.getElementById('modal-close');

            container.className = 'modal-content pdf-view';
            closeBtn.style.color = "#333"; 

            container.innerHTML = `
                <a href="${pdfUrl}" download class="download-btn">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="white"><path d="M5 20h14v-2H5v2zM19 9h-4V3H9v6H5l7 7 7-7z"/></svg>
                    Download PDF
                </a>
                <img src="${imgUrl}" class="resume-img" alt="Resume" loading="lazy">
            `;
            modal.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        // --- UNIFIED SLIDER (VIDEOS & IMAGES) ---
        function openMedia(cardElement) {
            currentGallery = [];
            
            // Gather all visible media cards in the same category
            const section = cardElement.closest('section');
            const cards = section.querySelectorAll('.project-card');
            
            cards.forEach(card => {
                if (window.getComputedStyle(card).display !== 'none') {
                    currentGallery.push({
                        type: card.getAttribute('data-type'),
                        url: card.getAttribute('data-url'),
                        format: card.getAttribute('data-format'),
                        title: card.getAttribute('data-title'),
                        subtitle: card.getAttribute('data-subtitle'),
                        caption: card.getAttribute('data-caption')
                    });
                }
            });

            const targetUrl = cardElement.getAttribute('data-url');
            currentGalleryIndex = currentGallery.findIndex(item => item.url === targetUrl);
            if (currentGalleryIndex === -1) currentGalleryIndex = 0;

            const modal = document.getElementById('video-modal');
            const container = document.getElementById('modal-container');
            const closeBtn = document.getElementById('modal-close');

            container.className = 'modal-content unified-view';
            closeBtn.style.color = "#fff"; 

            container.innerHTML = `
                <div class="gallery-wrapper">
                    <div class="nav-btn prev-btn" id="gallery-prev" onclick="navigateGallery(-1, event)">
                        <svg viewBox="0 0 24 24"><path d="M15.41 16.59L10.83 12l4.58-4.59L14 6l-6 6 6 6 1.41-1.41z"/></svg>
                    </div>
                    <div class="slide-content-container" id="slide-container"></div>
                    <div class="nav-btn next-btn" id="gallery-next" onclick="navigateGallery(1, event)">
                         <svg viewBox="0 0 24 24"><path d="M8.59 16.59L13.17 12 8.59 7.41 10 6l6 6-6 6-1.41-1.41z"/></svg>
                    </div>
                </div>
            `;
            
            updateGalleryView('none');
            modal.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function navigateGallery(direction, event) {
            event.stopPropagation();
            const newIndex = currentGalleryIndex + direction;
            if (newIndex >= 0 && newIndex < currentGallery.length) {
                currentGalleryIndex = newIndex;
                updateGalleryView(direction === 1 ? 'right' : 'left');
            }
        }

        function updateGalleryView(direction) {
            const item = currentGallery[currentGalleryIndex];
            const slideContainer = document.getElementById('slide-container');
            const prevBtn = document.getElementById('gallery-prev');
            const nextBtn = document.getElementById('gallery-next');

            // Hide arrows if at the start/end
            prevBtn.style.display = currentGalleryIndex === 0 ? 'none' : 'flex';
            nextBtn.style.display = currentGalleryIndex === currentGallery.length - 1 ? 'none' : 'flex';

            if (direction !== 'none' && slideContainer.innerHTML.trim() !== '') {
                slideContainer.style.transform = direction === 'right' ? 'translateX(-30px)' : 'translateX(30px)';
                slideContainer.style.opacity = '0';
                
                setTimeout(() => { renderSlide(item, direction); }, 200); 
            } else {
                renderSlide(item, 'none');
            }
        }

        function renderSlide(item, direction) {
            const slideContainer = document.getElementById('slide-container');
            
            let captionHtml = '';
            if (item.caption && item.caption !== 'undefined' && item.caption !== '') {
                captionHtml = `<div class="media-caption">${decodeURIComponent(item.caption)}</div>`;
            }

            let mediaHtml = '';
            if (item.type === 'video') {
                mediaHtml = `
                    <div class="media-box ${item.format}">
                        <iframe src="https://www.youtube.com/embed/${item.url}?autoplay=1&controls=1&rel=0" allow="autoplay; encrypted-media; fullscreen" allowfullscreen></iframe>
                    </div>
                `;
            } else {
                mediaHtml = `
                    <div class="media-box image-box">
                        <img src="${item.url}" alt="${item.title}" loading="lazy">
                    </div>
                `;
            }

            let detailsHtml = `
                <div class="media-details">
                    <h3 class="media-title">${item.title}</h3>
                    <p class="media-subtitle">${item.subtitle}</p>
                </div>
            `;

            slideContainer.innerHTML = captionHtml + mediaHtml + detailsHtml;
            
            slideContainer.style.transition = 'none';
            if (direction === 'right') slideContainer.style.transform = 'translateX(30px)';
            else if (direction === 'left') slideContainer.style.transform = 'translateX(-30px)';
            else slideContainer.style.transform = 'translateX(0)';
            
            slideContainer.style.opacity = '0';
            void slideContainer.offsetWidth; // trigger reflow
            
            slideContainer.style.transition = 'transform 0.35s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.35s ease';
            slideContainer.style.transform = 'translateX(0)';
            slideContainer.style.opacity = '1';
        }

        document.addEventListener('keydown', (e) => {
            const modal = document.getElementById('video-modal');
            if (modal.classList.contains('active')) {
                if (currentGallery.length > 0) {
                    if (e.key === 'ArrowLeft' && currentGalleryIndex > 0) navigateGallery(-1, e);
                    else if (e.key === 'ArrowRight' && currentGalleryIndex < currentGallery.length - 1) navigateGallery(1, e);
                }
                if (e.key === 'Escape') closeModal();
            }
        });

        function closeModal() {
            const modal = document.getElementById('video-modal');
            const container = document.getElementById('modal-container');
            modal.classList.remove('active');
            container.innerHTML = '';
            document.body.style.overflow = 'auto';
            currentGallery = [];
        }

        function copyEmail(email) {
            navigator.clipboard.writeText(email);
            const toast = document.getElementById('toast');
            toast.classList.add('show');
            setTimeout(() => { toast.classList.remove('show'); }, 3000);
        }
    </script>
</body>
</html>
